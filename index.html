<!DOCTYPE html>
<html lang="en" class="transition-colors duration-500">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockSense IMS | Dashboard</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    animation: {
                        'fade-in-up': 'fadeInUp 0.5s ease-out forwards',
                        'wave': 'wave 2s infinite',
                        'slide-in-right': 'slideInRight 0.4s ease-out forwards',
                        'blob': 'blob 7s infinite',
                        'bounce-soft': 'bounceSoft 2s infinite',
                        'stagger-slide': 'staggerSlide 0.5s ease-out forwards',
                    },
                    keyframes: {
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        wave: {
                            '0%, 100%': { transform: 'rotate(0deg)' },
                            '25%': { transform: 'rotate(-15deg)' },
                            '75%': { transform: 'rotate(15deg)' },
                        },
                        slideInRight: {
                            '0%': { opacity: '0', transform: 'translateX(50px)' },
                            '100%': { opacity: '1', transform: 'translateX(0)' },
                        },
                        blob: {
                            '0%': { transform: 'translate(0px, 0px) scale(1)' },
                            '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                            '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                            '100%': { transform: 'translate(0px, 0px) scale(1)' },
                        },
                        bounceSoft: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-15%)' },
                        },
                        staggerSlide: {
                            '0%': { opacity: '0', transform: 'translateX(-20px)' },
                            '100%': { opacity: '1', transform: 'translateX(0)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #c7d2fe; border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background-color: #818cf8; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #4f46e5; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb:hover { background-color: #6366f1; }
        
        .ripple {
            position: absolute; border-radius: 50%; transform: scale(0);
            animation: ripple-anim 0.6s linear; background-color: rgba(255, 255, 255, 0.4); pointer-events: none;
        }
        .dark .ripple { background-color: rgba(255, 255, 255, 0.2); }
        @keyframes ripple-anim { to { transform: scale(4); opacity: 0; } }

        .animation-delay-2000 { animation-delay: 2s; }
        .animation-delay-4000 { animation-delay: 4s; }

        body, button, select, input, a, tr { cursor: default !important; }

        #cursor-dot {
            position: fixed; top: 0; left: 0; width: 8px; height: 8px;
            background-color: #6366f1; border-radius: 50%; pointer-events: none;
            transform: translate(-50%, -50%); z-index: 99999; transition: background-color 0.2s ease, transform 0.1s ease;
        }

        #cursor-outline {
            position: fixed; top: 0; left: 0; width: 34px; height: 34px;
            border: 2px solid #6366f1; border-radius: 50%; pointer-events: none;
            transform: translate(-50%, -50%); transition: width 0.2s ease, height 0.2s ease, background-color 0.2s ease, border-color 0.2s ease;
            z-index: 99998;
        }

        .cursor-hover #cursor-outline {
            width: 55px; height: 55px; background-color: rgba(99, 102, 241, 0.15); border-color: rgba(99, 102, 241, 0.6);
        }
        .cursor-hover #cursor-dot {
            background-color: #4f46e5; transform: translate(-50%, -50%) scale(0.5);
        }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 flex h-screen font-sans text-gray-800 dark:text-gray-100 transition-colors duration-500 overflow-hidden relative">

    <div id="cursor-dot"></div>
    <div id="cursor-outline"></div>

    <div class="fixed top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none transition-opacity duration-700">
        <div class="absolute top-[-10%] left-[-10%] w-[500px] h-[500px] bg-indigo-400/30 dark:bg-indigo-600/20 rounded-full mix-blend-multiply dark:mix-blend-screen filter blur-3xl opacity-70 animate-blob"></div>
        <div class="absolute top-[20%] right-[-10%] w-[500px] h-[500px] bg-purple-400/30 dark:bg-purple-600/20 rounded-full mix-blend-multiply dark:mix-blend-screen filter blur-3xl opacity-70 animate-blob animation-delay-2000"></div>
        <div class="absolute bottom-[-20%] left-[20%] w-[500px] h-[500px] bg-pink-400/30 dark:bg-pink-600/20 rounded-full mix-blend-multiply dark:mix-blend-screen filter blur-3xl opacity-70 animate-blob animation-delay-4000"></div>
    </div>

    <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-3"></div>

    <aside class="w-64 bg-white/70 dark:bg-gray-950/70 backdrop-blur-2xl text-gray-800 dark:text-white flex flex-col shadow-2xl sidebar-custom transition-colors duration-500 z-20 border-r border-white/40 dark:border-gray-800/50">
        <div class="h-20 flex items-center justify-center border-b border-gray-200/50 dark:border-gray-800/50 font-bold text-2xl tracking-wider bg-gradient-to-r from-indigo-600 to-purple-600 dark:from-indigo-400 dark:to-purple-400 bg-clip-text text-transparent transform transition hover:scale-105">
            📦 StockSense
        </div>
        
        <nav class="flex-1 px-4 py-8 space-y-4 relative z-10">
            <button id="btn-dashboard" class="nav-btn btn-ripple relative overflow-hidden w-full text-left px-5 py-4 text-base bg-indigo-50 dark:bg-indigo-600/20 text-indigo-600 dark:text-indigo-400 border border-indigo-200 dark:border-indigo-500/30 rounded-xl font-semibold transition-all shadow-sm transform hover:-translate-y-1">📊 Dashboard</button>
            <button id="btn-products" class="nav-btn btn-ripple relative overflow-hidden w-full text-left px-5 py-4 text-base hover:bg-gray-100 dark:hover:bg-gray-800 rounded-xl font-medium text-gray-600 dark:text-gray-300 hover:text-gray-900 dark:hover:text-white transition-all transform hover:-translate-y-1">🛒 Products</button>
            <button id="btn-operations" class="nav-btn btn-ripple relative overflow-hidden w-full text-left px-5 py-4 text-base hover:bg-gray-100 dark:hover:bg-gray-800 rounded-xl font-medium text-gray-600 dark:text-gray-300 hover:text-gray-900 dark:hover:text-white transition-all transform hover:-translate-y-1">🔄 Operations</button>
        </nav>

        <div class="p-4 mt-auto border-t border-gray-200/50 dark:border-gray-800/50 relative z-10 space-y-3">
            <button id="theme-toggle" class="nav-btn btn-ripple relative overflow-hidden w-full flex items-center justify-center gap-2 px-4 py-3.5 text-sm bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-300 rounded-xl font-semibold transition-all shadow-sm transform hover:-translate-y-1">
                <span id="theme-icon-dark" class="hidden">🌙 Dark Mode</span>
                <span id="theme-icon-light" class="hidden">☀️ Light Mode</span>
            </button>
            <a href="/logout" id="logout-btn" class="nav-btn btn-ripple relative overflow-hidden w-full flex items-center justify-center gap-2 px-4 py-3.5 text-sm bg-rose-500/10 hover:bg-rose-500 hover:text-white text-rose-600 dark:text-rose-400 border border-rose-200 dark:border-rose-500/30 rounded-xl font-semibold transition-all shadow-sm transform hover:-translate-y-1 text-center">
                🚪 Logout
            </a>
        </div>
    </aside>

    <main class="flex-1 flex flex-col overflow-hidden relative bg-transparent transition-colors">
        
        <header class="h-20 bg-white/70 dark:bg-gray-900/70 backdrop-blur-md shadow-sm flex items-center px-10 justify-between z-10 transition-colors border-b border-gray-200/50 dark:border-gray-800/50">
            <h1 class="text-2xl font-bold text-gray-800 dark:text-white tracking-tight" id="page-title">Inventory Dashboard</h1>
            <div class="flex items-center gap-3 bg-white/50 dark:bg-gray-800/50 backdrop-blur-sm px-5 py-2.5 rounded-full border border-gray-200 dark:border-gray-700 shadow-sm transition-transform hover:scale-105 cursor-pointer">
                <span class="inline-block animate-wave text-lg origin-bottom-right">👋</span>
                <span id="greeting-text" class="text-sm text-gray-600 dark:text-gray-300 font-medium">Welcome Back</span>
            </div>
        </header>

        <div class="p-10 overflow-y-auto custom-scrollbar h-full relative z-0">
            
            <div id="view-dashboard" class="view-section animate-fade-in-up">
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 mb-10">
                    <div class="group bg-gradient-to-br from-indigo-500 via-purple-500 to-indigo-600 rounded-2xl shadow-lg shadow-indigo-500/20 p-8 text-white transform transition-all duration-300 hover:-translate-y-2 hover:scale-[1.02] hover:shadow-2xl hover:shadow-indigo-500/40 relative overflow-hidden">
                        <div class="absolute -right-10 -top-10 w-32 h-32 bg-white/10 rounded-full blur-2xl group-hover:scale-150 transition-transform duration-700"></div>
                        <div class="flex justify-between items-start relative z-10">
                            <div>
                                <h3 class="text-indigo-100 text-sm font-semibold uppercase tracking-wider mb-2 opacity-90">Total Products</h3>
                                <div class="text-6xl font-black tracking-tight" id="totalProducts">0</div>
                            </div>
                            <div class="p-4 bg-white/20 rounded-2xl backdrop-blur-md text-3xl shadow-inner group-hover:animate-bounce-soft">📦</div>
                        </div>
                    </div>
                    
                    <div class="group bg-gradient-to-br from-rose-500 via-orange-500 to-rose-600 rounded-2xl shadow-lg shadow-rose-500/20 p-8 text-white transform transition-all duration-300 hover:-translate-y-2 hover:scale-[1.02] hover:shadow-2xl hover:shadow-rose-500/40 relative overflow-hidden">
                        <div class="absolute -right-10 -top-10 w-32 h-32 bg-white/10 rounded-full blur-2xl group-hover:scale-150 transition-transform duration-700"></div>
                        <div class="flex justify-between items-start relative z-10">
                            <div>
                                <h3 class="text-rose-100 text-sm font-semibold uppercase tracking-wider mb-2 opacity-90">Low Stock Alerts</h3>
                                <div class="text-6xl font-black tracking-tight" id="lowStockCount">0</div>
                            </div>
                            <div class="p-4 bg-white/20 rounded-2xl backdrop-blur-md text-3xl shadow-inner group-hover:animate-bounce-soft">⚠️</div>
                        </div>
                    </div>
                </div>

                <div class="bg-white/80 dark:bg-gray-800/80 backdrop-blur-xl rounded-2xl shadow-sm border border-gray-200/50 dark:border-gray-700/50 p-8 transition-colors transform hover:shadow-lg duration-300">
                    <h2 class="text-xl font-bold text-gray-800 dark:text-white mb-6 flex items-center gap-2">
                        <span class="text-rose-500 animate-pulse text-2xl">🔴</span> Needs Attention
                    </h2>
                    <ul id="lowStockList" class="space-y-4">
                        <li class="text-gray-500 dark:text-gray-400 text-sm animate-pulse">Scanning inventory...</li>
                    </ul>
                </div>
            </div>

            <div id="view-products" class="view-section hidden opacity-0">
                <div class="grid grid-cols-1 xl:grid-cols-3 gap-8">
                    <div class="bg-white/80 dark:bg-gray-800/80 backdrop-blur-xl rounded-2xl shadow-sm border border-gray-200/50 dark:border-gray-700/50 p-8 col-span-1 h-fit transition-all hover:shadow-lg duration-300">
                        <h2 class="text-xl font-bold text-gray-800 dark:text-white mb-6 border-b border-gray-100 dark:border-gray-700 pb-4">✨ Add New Product</h2>
                        <div id="formMsg" class="mb-4 text-sm font-semibold hidden"></div>
                        <form id="addProductForm" class="space-y-5">
                            <div class="group">
                                <label class="text-xs uppercase tracking-wider text-gray-500 dark:text-gray-400 font-bold mb-1 block">Product Name</label>
                                <input type="text" id="pName" required class="w-full p-3.5 border border-gray-200 dark:border-gray-600 rounded-xl bg-white/50 dark:bg-gray-900/50 dark:text-white focus:outline-none focus:ring-4 focus:ring-indigo-500/30 transition-all shadow-sm">
                            </div>
                            <div class="group">
                                <label class="text-xs uppercase tracking-wider text-gray-500 dark:text-gray-400 font-bold mb-1 block">SKU / Code</label>
                                <input type="text" id="pSku" required class="w-full p-3.5 border border-gray-200 dark:border-gray-600 rounded-xl bg-white/50 dark:bg-gray-900/50 dark:text-white focus:outline-none focus:ring-4 focus:ring-indigo-500/30 transition-all shadow-sm">
                            </div>
                            <div class="group">
                                <label class="text-xs uppercase tracking-wider text-gray-500 dark:text-gray-400 font-bold mb-1 block">Category</label>
                                <input type="text" id="pCat" required class="w-full p-3.5 border border-gray-200 dark:border-gray-600 rounded-xl bg-white/50 dark:bg-gray-900/50 dark:text-white focus:outline-none focus:ring-4 focus:ring-indigo-500/30 transition-all shadow-sm">
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div class="group">
                                    <label class="text-xs uppercase tracking-wider text-gray-500 dark:text-gray-400 font-bold mb-1 block">Unit</label>
                                    <input type="text" id="pUnit" required class="w-full p-3.5 border border-gray-200 dark:border-gray-600 rounded-xl bg-white/50 dark:bg-gray-900/50 dark:text-white focus:outline-none focus:ring-4 focus:ring-indigo-500/30 transition-all shadow-sm" placeholder="e.g. kg">
                                </div>
                                <div class="group">
                                    <label class="text-xs uppercase tracking-wider text-gray-500 dark:text-gray-400 font-bold mb-1 block">Init Stock</label>
                                    <input type="number" id="pStock" value="0" min="0" required class="w-full p-3.5 border border-gray-200 dark:border-gray-600 rounded-xl bg-white/50 dark:bg-gray-900/50 dark:text-white focus:outline-none focus:ring-4 focus:ring-indigo-500/30 transition-all shadow-sm">
                                </div>
                            </div>
                            <button type="submit" class="btn-ripple relative overflow-hidden w-full bg-gradient-to-r from-indigo-600 to-purple-600 text-white p-4 rounded-xl font-bold transition-all shadow-lg hover:shadow-indigo-500/40 transform hover:-translate-y-1 active:scale-95 mt-4">
                                Save Product +
                            </button>
                        </form>
                    </div>
                    
                    <div class="bg-white/80 dark:bg-gray-800/80 backdrop-blur-xl rounded-2xl shadow-sm border border-gray-200/50 dark:border-gray-700/50 p-8 col-span-2 transition-all hover:shadow-lg duration-300">
                        <h2 class="text-xl font-bold text-gray-800 dark:text-white mb-6 border-b border-gray-100 dark:border-gray-700 pb-4">📋 Product Directory</h2>
                        <div class="overflow-x-auto rounded-xl border border-gray-200/50 dark:border-gray-700/50 bg-white/50 dark:bg-gray-900/50">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="bg-gray-50/50 dark:bg-gray-800/50 text-gray-500 dark:text-gray-400 text-xs uppercase tracking-wider border-b border-gray-200/50 dark:border-gray-700/50">
                                        <th class="p-4 font-bold">ID</th>
                                        <th class="p-4 font-bold">Name</th>
                                        <th class="p-4 font-bold">SKU</th>
                                        <th class="p-4 font-bold">Category</th>
                                        <th class="p-4 font-bold text-right">Stock Level</th>
                                    </tr>
                                </thead>
                                <tbody id="productTableBody" class="text-sm text-gray-700 dark:text-gray-300 divide-y divide-gray-100/50 dark:divide-gray-700/50"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <div id="view-operations" class="view-section hidden opacity-0">
                <div class="grid grid-cols-1 xl:grid-cols-3 gap-8">
                    <div class="bg-white/80 dark:bg-gray-800/80 backdrop-blur-xl rounded-2xl shadow-sm border border-gray-200/50 dark:border-gray-700/50 p-8 col-span-1 h-fit transition-all hover:shadow-lg duration-300">
                        <h2 class="text-xl font-bold text-gray-800 dark:text-white mb-6 border-b border-gray-100 dark:border-gray-700 pb-4">🔄 Log Movement</h2>
                        <div id="opFormMsg" class="mb-4 text-sm font-semibold hidden"></div>
                        <form id="operationForm" class="space-y-5">
                            <div class="group">
                                <label class="text-xs uppercase tracking-wider text-gray-500 dark:text-gray-400 font-bold mb-1 block">Select Product</label>
                                <select id="opProduct" required class="w-full p-3.5 border border-gray-200 dark:border-gray-600 rounded-xl bg-white/50 dark:bg-gray-900/50 dark:text-white focus:outline-none focus:ring-4 focus:ring-emerald-500/30 transition-all shadow-sm cursor-pointer"></select>
                            </div>
                            <div class="group">
                                <label class="text-xs uppercase tracking-wider text-gray-500 dark:text-gray-400 font-bold mb-1 block">Action Type</label>
                                <select id="opType" required class="w-full p-3.5 border border-gray-200 dark:border-gray-600 rounded-xl bg-white/50 dark:bg-gray-900/50 dark:text-white focus:outline-none focus:ring-4 focus:ring-emerald-500/30 transition-all shadow-sm cursor-pointer">
                                    <option value="Receipt">📥 Receipt (Stock In)</option>
                                    <option value="Delivery">📤 Delivery (Stock Out)</option>
                                </select>
                            </div>
                            <div class="group">
                                <label class="text-xs uppercase tracking-wider text-gray-500 dark:text-gray-400 font-bold mb-1 block">Quantity</label>
                                <input type="number" id="opQty" min="1" required class="w-full p-3.5 border border-gray-200 dark:border-gray-600 rounded-xl bg-white/50 dark:bg-gray-900/50 dark:text-white focus:outline-none focus:ring-4 focus:ring-emerald-500/30 transition-all shadow-sm" placeholder="Enter quantity">
                            </div>
                            <button type="submit" class="btn-ripple relative overflow-hidden w-full bg-gradient-to-r from-emerald-600 to-teal-600 text-white p-4 rounded-xl font-bold transition-all shadow-lg hover:shadow-emerald-500/40 transform hover:-translate-y-1 active:scale-95 mt-4">
                                Confirm Movement 🔄
                            </button>
                        </form>
                    </div>

                    <div class="bg-white/80 dark:bg-gray-800/80 backdrop-blur-xl rounded-2xl shadow-sm border border-gray-200/50 dark:border-gray-700/50 p-8 col-span-2 transition-all hover:shadow-lg duration-300">
                        <h2 class="text-xl font-bold text-gray-800 dark:text-white mb-6 border-b border-gray-100 dark:border-gray-700 pb-4">📜 Inventory Ledger History</h2>
                        <div class="overflow-x-auto rounded-xl border border-gray-200/50 dark:border-gray-700/50 bg-white/50 dark:bg-gray-900/50">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="bg-gray-50/50 dark:bg-gray-800/50 text-gray-500 dark:text-gray-400 text-xs uppercase tracking-wider border-b border-gray-200/50 dark:border-gray-700/50">
                                        <th class="p-4 font-bold">ID</th>
                                        <th class="p-4 font-bold">Product Name</th>
                                        <th class="p-4 font-bold">Type</th>
                                        <th class="p-4 font-bold">Qty</th>
                                    </tr>
                                </thead>
                                <tbody id="ledgerTableBody" class="text-sm text-gray-700 dark:text-gray-300 divide-y divide-gray-100/50 dark:divide-gray-700/50"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script>
        // Get user_id from localStorage (fallback to 1 if not logged in properly)
        const currentUserId = localStorage.getItem('user_id') || "1";

        // --- 1. Dashboard Logic ---
        async function fetchDashboardData() {
            try {
                const response = await fetch(`/dashboard/?user_id=${currentUserId}`);
                if (!response.ok) throw new Error('Dashboard fetch failed');
                const data = await response.json();
                
                const totalProductsEl = document.getElementById('totalProducts');
                if (totalProductsEl) totalProductsEl.innerText = data["Total Products in Stock"];
                
                const lowStockItems = data["Low Stock Alerts"];
                const lowStockCountEl = document.getElementById('lowStockCount');
                if (lowStockCountEl) lowStockCountEl.innerText = lowStockItems.length;

                const listElement = document.getElementById('lowStockList');
                if (listElement) {
                    listElement.innerHTML = ''; 
                    if (lowStockItems.length === 0) {
                        listElement.innerHTML = `<li class="p-3 bg-green-50 text-green-700 rounded-md text-sm border border-green-100">✅ All products are well stocked!</li>`;
                    } else {
                        lowStockItems.forEach(item => {
                            listElement.innerHTML += `<li class="p-3 bg-red-50 text-red-700 rounded-md text-sm border border-red-100">🔴 <b>${item}</b> is running low!</li>`;
                        });
                    }
                }
            } catch (error) {
                console.error("Dashboard error:", error);
            }
        }

        // --- 2. Products Logic ---
        async function fetchProducts() {
            try {
                const response = await fetch(`/products/?user_id=${currentUserId}`);
                if (!response.ok) throw new Error('Products fetch failed');
                const products = await response.json();
                const tbody = document.getElementById('productTableBody');
                
                if (tbody) {
                    tbody.innerHTML = ''; 
                    if (products.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="5" class="p-4 text-center text-gray-500">No products found. Add one!</td></tr>';
                        return;
                    }
                    products.forEach(p => {
                        const stockColor = p.total_stock < 10 ? 'text-red-600 font-bold' : 'text-green-600 font-bold';
                        tbody.innerHTML += `
                            <tr class="hover:bg-gray-50/50 transition border-b border-gray-50">
                                <td class="p-4 text-gray-500">#${p.id}</td>
                                <td class="p-4 font-medium text-gray-800 dark:text-white">${p.name}</td>
                                <td class="p-4 text-gray-600 dark:text-gray-300">${p.sku}</td>
                                <td class="p-4 text-gray-600 dark:text-gray-300">${p.category}</td>
                                <td class="p-4 text-right ${stockColor}">${p.total_stock} ${p.unit_of_measure}</td>
                            </tr>
                        `;
                    });
                }
            } catch (error) {
                console.error("Products error:", error);
            }
        }

        const addProductForm = document.getElementById('addProductForm');
        if (addProductForm) {
            addProductForm.addEventListener('submit', async function(e) {
                e.preventDefault(); 
                const msgDiv = document.getElementById('formMsg');
                msgDiv.classList.remove('hidden', 'text-red-600', 'text-green-600');
                msgDiv.innerText = "Saving...";

                const newProduct = {
                    user_id: parseInt(currentUserId),
                    name: document.getElementById('pName').value,
                    sku: document.getElementById('pSku').value,
                    category: document.getElementById('pCat').value,
                    unit_of_measure: document.getElementById('pUnit').value,
                    initial_stock: parseInt(document.getElementById('pStock').value)
                };

                try {
                    const response = await fetch('/products/', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(newProduct)
                    });

                    if (response.ok) {
                        msgDiv.classList.add('text-green-600');
                        msgDiv.innerText = "✅ Product Added Successfully!";
                        document.getElementById('addProductForm').reset();
                        fetchProducts(); 
                        fetchDashboardData();
                    } else {
                        const errData = await response.json();
                        msgDiv.classList.add('text-red-600');
                        msgDiv.innerText = "❌ Error: " + errData.detail;
                    }
                } catch (error) {
                    msgDiv.classList.add('text-red-600');
                    msgDiv.innerText = "❌ Network Error!";
                }
            });
        }

        // --- 3. Operations & Ledger Logic ---
        let allProductsCache = {}; 

        async function fetchLedgerAndProducts() {
            try {
                const prodRes = await fetch(`/products/?user_id=${currentUserId}`);
                if (!prodRes.ok) throw new Error('Failed to fetch products');
                const products = await prodRes.json();
                
                const select = document.getElementById('opProduct');
                if (select) {
                    select.innerHTML = '<option value="">Select a Product</option>';
                    products.forEach(p => {
                        allProductsCache[p.id] = p.name; 
                        select.innerHTML += `<option value="${p.id}">${p.name} (Stock: ${p.total_stock})</option>`;
                    });
                }

                const ledRes = await fetch(`/inventory/ledger/?user_id=${currentUserId}`);
                if (!ledRes.ok) throw new Error('Failed to fetch ledger');
                const ledger = await ledRes.json();
                const tbody = document.getElementById('ledgerTableBody');
                
                if (tbody) {
                    tbody.innerHTML = '';
                    if (ledger.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-gray-500">No transactions yet.</td></tr>';
                        return;
                    }

                    ledger.forEach(entry => {
                        const typeColor = entry.transaction_type === 'Receipt' ? 'text-green-600 font-bold' : 'text-red-600 font-bold';
                        const sign = entry.transaction_type === 'Receipt' ? '+' : '-';
                        const prodName = allProductsCache[entry.product_id] || "Unknown";

                        tbody.innerHTML += `
                            <tr class="hover:bg-gray-50/50 transition border-b border-gray-50">
                                <td class="p-4 text-gray-500">#${entry.id}</td>
                                <td class="p-4 font-medium text-gray-800 dark:text-white">${prodName}</td>
                                <td class="p-4 ${typeColor}">${entry.transaction_type}</td>
                                <td class="p-4 font-bold">${sign}${Math.abs(entry.quantity)}</td>
                            </tr>
                        `;
                    });
                }
            } catch (error) {
                console.error("Operations error:", error);
            }
        }

        const operationForm = document.getElementById('operationForm');
        if (operationForm) {
            operationForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                const msgDiv = document.getElementById('opFormMsg');
                msgDiv.classList.remove('hidden', 'text-red-600', 'text-green-600');
                msgDiv.innerText = "Processing...";

                const payload = {
                    user_id: parseInt(currentUserId),
                    product_id: parseInt(document.getElementById('opProduct').value),
                    transaction_type: document.getElementById('opType').value,
                    quantity: parseInt(document.getElementById('opQty').value)
                };

                try {
                    const response = await fetch('/inventory/move/', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (response.ok) {
                        msgDiv.classList.add('text-green-600');
                        msgDiv.innerText = "✅ Transaction Successful!";
                        document.getElementById('opQty').value = ''; 
                        fetchLedgerAndProducts(); 
                        fetchDashboardData();
                    } else {
                        const errData = await response.json();
                        msgDiv.classList.add('text-red-600');
                        msgDiv.innerText = "❌ Error: " + errData.detail; 
                    }
                } catch (error) {
                    msgDiv.classList.add('text-red-600');
                    msgDiv.innerText = "❌ Network Error!";
                }
            });
        }

        // --- 4. Navigation ---
        function setupNavigation() {
            const btns = {
                'btn-dashboard': { view: 'view-dashboard', title: 'Inventory Dashboard' },
                'btn-products': { view: 'view-products', title: 'Products Management' },
                'btn-operations': { view: 'view-operations', title: 'Stock Operations' }
            };

            const allViews = document.querySelectorAll('.view-section');
            const allBtns = document.querySelectorAll('.nav-btn');

            for (const [btnId, config] of Object.entries(btns)) {
                const button = document.getElementById(btnId);
                
                if (button) {
                    button.addEventListener('click', () => {
                        allViews.forEach(v => {
                            v.classList.add('hidden');
                            v.classList.remove('opacity-100');
                        });
                        allBtns.forEach(b => {
                            b.classList.remove('bg-indigo-50', 'dark:bg-indigo-600/20', 'text-indigo-600', 'dark:text-indigo-400', 'border-indigo-200', 'dark:border-indigo-500/30');
                        });

                        const targetView = document.getElementById(config.view);
                        if (targetView) {
                            targetView.classList.remove('hidden');
                            setTimeout(() => targetView.classList.add('opacity-100'), 10);
                        }
                        
                        button.classList.add('bg-indigo-50', 'dark:bg-indigo-600/20', 'text-indigo-600', 'dark:text-indigo-400', 'border', 'border-indigo-200', 'dark:border-indigo-500/30');
                        
                        const pageTitle = document.getElementById('page-title');
                        if (pageTitle) pageTitle.innerText = config.title;
                        
                        if (btnId === 'btn-dashboard') fetchDashboardData();
                        if (btnId === 'btn-products') fetchProducts();
                        if (btnId === 'btn-operations') fetchLedgerAndProducts();
                    });
                }
            }
        }

        // --- Theme Toggle ---
        const themeToggleBtn = document.getElementById('theme-toggle');
        const darkIcon = document.getElementById('theme-icon-dark');
        const lightIcon = document.getElementById('theme-icon-light');
        const htmlElement = document.documentElement;

        function updateThemeIcons(isDark) {
            if (isDark) {
                darkIcon.classList.remove('hidden');
                lightIcon.classList.add('hidden');
            } else {
                darkIcon.classList.add('hidden');
                lightIcon.classList.remove('hidden');
            }
        }

        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            htmlElement.classList.add('dark');
            updateThemeIcons(true);
        } else {
            htmlElement.classList.remove('dark');
            updateThemeIcons(false);
        }

        themeToggleBtn.addEventListener('click', () => {
            htmlElement.classList.toggle('dark');
            const isDark = htmlElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            updateThemeIcons(isDark);
        });

        // --- Custom Cursor & Ripple Effects ---
        const cursorDot = document.getElementById("cursor-dot");
        const cursorOutline = document.getElementById("cursor-outline");
        let mouseX = 0, mouseY = 0;
        let outlineX = 0, outlineY = 0;

        window.addEventListener("mousemove", (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            cursorDot.style.left = `${mouseX}px`; 
            cursorDot.style.top = `${mouseY}px`;
            document.body.classList.toggle('cursor-hover', !!e.target.closest('button, input, select, a, tr'));
        });

        function animateCursor() {
            outlineX += (mouseX - outlineX) * 0.15;
            outlineY += (mouseY - outlineY) * 0.15;
            cursorOutline.style.left = `${outlineX}px`;
            cursorOutline.style.top = `${outlineY}px`;
            requestAnimationFrame(animateCursor);
        }
        animateCursor();

        document.querySelectorAll('.btn-ripple').forEach(btn => {
            btn.addEventListener('click', function(e) {
                const rect = this.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const ripple = document.createElement('span');
                ripple.className = 'ripple';
                ripple.style.left = `${x}px`;
                ripple.style.top = `${y}px`;
                this.appendChild(ripple);
                setTimeout(() => ripple.remove(), 600);
            });
        });

        // Initialize on page load
        window.onload = () => {
            fetchDashboardData();
            setupNavigation();
            fetchProducts();
            fetchLedgerAndProducts();
        };
    </script>
</body>
</html>
