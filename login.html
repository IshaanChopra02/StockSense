<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockSense | Login & Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white flex items-center justify-center h-screen">
    <div class="bg-gray-900 p-8 rounded-2xl shadow-xl w-96 border border-gray-800">
        <h2 class="text-2xl font-bold mb-6 text-center bg-gradient-to-r from-indigo-500 to-purple-500 bg-clip-text text-transparent">📦 StockSense Login</h2>
        
        <div id="authMsg" class="mb-4 text-sm text-center font-medium"></div>

        <form id="loginForm" class="space-y-4">
            <div>
                <label class="text-xs uppercase text-gray-400 font-bold block mb-1">Email</label>
                <input type="email" id="loginEmail" required class="w-full p-3 bg-gray-800 border border-gray-700 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
                <label class="text-xs uppercase text-gray-400 font-bold block mb-1">Password</label>
                <input type="password" id="loginPassword" required class="w-full p-3 bg-gray-800 border border-gray-700 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white p-3 rounded-xl font-bold transition">Sign In 🚀</button>
        </form>

        <div id="otpSection" class="hidden mt-4 space-y-4">
            <div>
                <label class="text-xs uppercase text-indigo-400 font-bold block mb-1">Enter 6-Digit OTP (Check Terminal)</label>
                <input type="text" id="loginOtp" maxlength="6" class="w-full p-3 bg-gray-800 border border-indigo-500 rounded-xl text-white text-center text-lg tracking-widest focus:outline-none">
            </div>
            <button id="verifyOtpBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white p-3 rounded-xl font-bold transition">Verify & Enter App ✅</button>
        </div>
    </div>

    <script>
        let userEmail = "";
        const msg = document.getElementById('authMsg');

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            userEmail = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            msg.innerText = "Signing in...";
            msg.className = "mb-4 text-sm text-center font-medium text-yellow-400";

            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: userEmail, password: password })
            });

            const data = await res.json();
            if (res.ok && data.requires_otp) {
                msg.innerText = "🔑 OTP generated! Check your python terminal.";
                msg.className = "mb-4 text-sm text-center font-medium text-indigo-400";
                document.getElementById('loginForm').classList.add('hidden');
                document.getElementById('otpSection').classList.remove('hidden');
            } else {
                msg.innerText = "❌ " + (data.detail || "Login failed");
                msg.className = "mb-4 text-sm text-center font-medium text-red-500";
            }
        });

        document.getElementById('verifyOtpBtn').addEventListener('click', async () => {
            const otp = document.getElementById('loginOtp').value;
            const res = await fetch('/api/auth/verify-login-otp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: userEmail, otp: otp })
            });

            const data = await res.json();
            if (res.ok) {
                localStorage.setItem('user_id', data.user_id);
                window.location.href = '/app';
            } else {
                msg.innerText = "❌ " + (data.detail || "Invalid OTP");
                msg.className = "mb-4 text-sm text-center font-medium text-red-500";
            }
        });
    </script>
</body>
</html>
